<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shoebox</title>
<style>
  :root { --bg:#f6f3ee; --card:#fff; --ink:#1d1b18; --muted:#6b655c; --line:#e3ddd3; --accent:#2f6b4f; --warn:#b5542a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#171614; --card:#22201d; --ink:#eee9e1; --muted:#a59d90; --line:#37332d; --accent:#6cbf93; --warn:#e48a5f; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:20px 16px 8px; max-width:1200px; margin:auto; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  h1 { margin:0; font-size:24px; } header p { margin:0; color:var(--muted); }
  main { max-width:1200px; margin:auto; padding:8px 16px 40px; display:grid; grid-template-columns: 1fr 320px; gap:20px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } aside { order:-1; position:static !important; } }
  .r { background:var(--card); border:1px solid var(--line); border-radius:10px; display:grid; grid-template-columns:120px 1fr; gap:14px; padding:12px; margin-bottom:12px; }
  .r.done { opacity:.6; }
  .r img { width:120px; height:160px; object-fit:cover; border-radius:6px; cursor:zoom-in; background:var(--line); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  input, select { font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:6px; padding:4px 6px; min-width:0; }
  .vendor { font-weight:600; flex:1 1 160px; } .date { width:130px; } .num { width:90px; text-align:right; }
  .bad { border-color:var(--warn); outline:2px solid var(--warn); }
  select { width:100%; } select.personal { color:var(--warn); }
  .reason { color:var(--muted); font-size:13px; margin:6px 0; }
  label { font-size:13px; color:var(--muted); display:flex; gap:6px; align-items:center; cursor:pointer; }
  aside { position:sticky; top:12px; align-self:start; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  aside h2 { margin:0 0 8px; font-size:16px; }
  table { width:100%; border-collapse:collapse; font-size:13px; } td { padding:4px 0; border-bottom:1px solid var(--line); } td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  .total td { font-weight:700; border:0; padding-top:8px; }
  .btn { display:block; text-align:center; margin-top:14px; padding:10px; border-radius:8px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
  .note { font-size:12px; color:var(--muted); margin-top:10px; }
  dialog { border:0; padding:0; background:none; } dialog img { max-width:90vw; max-height:90vh; }
  dialog::backdrop { background:rgba(0,0,0,.7); }
</style>
</head>
<body>
<header><h1>🧾 Shoebox</h1><p id="status">Loading…</p></header>
<main><section id="list"></section>
  <aside><h2>Schedule C, Part II</h2><table id="sum"></table>
    <a class="btn" href="/export.csv">Export CSV for your accountant</a>
    <p class="note">Read on this laptop by a local model. Nothing was uploaded. Not tax advice; check with a preparer.</p>
  </aside></main>
<dialog id="zoom" onclick="this.close()"><img alt=""></dialog>
<script>
const $ = s => document.querySelector(s);
const money = n => '$' + Number(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
let cats = {};

function renderSummary(sum) {
  const rows = Object.entries(sum).map(([k, v]) => `<tr><td>${k}</td><td>${money(v)}</td></tr>`).join('');
  const total = Object.values(sum).reduce((a, b) => a + b, 0);
  $('#sum').innerHTML = rows + `<tr class="total"><td>Total deductible</td><td>${money(total)}</td></tr>`;
}

async function save(id, patch, card) {
  const r = await fetch('/api/' + id, {method:'POST', body:JSON.stringify(patch)});
  if (!r.ok) return alert('Save failed');
  renderSummary((await r.json()).summary);
  if ('reviewed' in patch) { card.classList.toggle('done', patch.reviewed); updateStatus(); }
}

function updateStatus() {
  const all = document.querySelectorAll('.r').length, done = document.querySelectorAll('.r.done').length;
  $('#status').textContent = `${all} receipts · ${done} reviewed`;
}

function card(id, r) {
  const el = document.createElement('article');
  el.className = 'r' + (r.reviewed ? ' done' : '');
  const opts = Object.keys(cats).map(c => `<option${c === r.category ? ' selected' : ''}>${c}</option>`).join('');
  el.innerHTML = `
    <img src="/img/${encodeURIComponent(r.file)}" alt="Receipt photo ${r.file}">
    <div>
      <div class="row">
        <input class="vendor" data-k="vendor" aria-label="Vendor">
        <input class="date" data-k="date" type="date" aria-label="Date">
        <input class="num" data-k="total" type="number" step="0.01" aria-label="Total">
      </div>
      <select data-k="category" aria-label="Schedule C line" class="${cats[r.category] ? '' : 'personal'}">${opts}</select>
      <p class="reason"></p>
      <label><input type="checkbox" data-k="reviewed"${r.reviewed ? ' checked' : ''}> Looks right</label>
    </div>`;
  // set values via DOM, not innerHTML, so model output is never parsed as HTML
  el.querySelector('[data-k=vendor]').value = r.vendor;
  el.querySelector('[data-k=date]').value = r.date;
  el.querySelector('[data-k=total]').value = r.total;
  if (!(r.total > 0)) el.querySelector('[data-k=total]').classList.add('bad');
  el.querySelector('.reason').textContent = `${r.items} — ${r.reason}`;
  el.querySelector('img').onclick = e => { $('#zoom img').src = e.target.src; $('#zoom').showModal(); };
  el.querySelectorAll('[data-k]').forEach(inp => inp.onchange = () => {
    const k = inp.dataset.k;
    const v = k === 'reviewed' ? inp.checked : k === 'total' ? parseFloat(inp.value) || 0 : inp.value;
    if (k === 'category') inp.className = cats[v] ? '' : 'personal';
    if (k === 'total') inp.classList.toggle('bad', !(v > 0));
    save(id, {[k]: v}, el);
  });
  return el;
}

fetch('/api').then(r => r.json()).then(d => {
  cats = d.categories;
  const list = $('#list');
  Object.entries(d.receipts).sort((a, b) => a[1].date.localeCompare(b[1].date))
    .forEach(([id, r]) => list.append(card(id, r)));
  renderSummary(d.summary);
  updateStatus();
});
</script>
</body>
</html>
